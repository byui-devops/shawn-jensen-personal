name: Terraform Release Pipeline

on:
  workflow_dispatch:
    inputs:
      aws_access_key_id:
        description: "AWS_ACCESS_KEY_ID from AWS Academy lab"
        required: true
        type: string
      aws_secret_access_key:
        description: "AWS_SECRET_ACCESS_KEY from AWS Academy lab"
        required: true
        type: string
      aws_session_token:
        description: "AWS_SESSION_TOKEN (lab session token)"
        required: true
        type: string
      aws_region:
        description: "AWS Region"
        required: true
        default: "us-east-1"
        type: string

jobs:
  terraform:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set working directory
      run: cd iac
      shell: bash

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ github.event.inputs.aws_access_key_id }}
        aws-secret-access-key: ${{ github.event.inputs.aws_secret_access_key }}
        aws-session-token: ${{ github.event.inputs.aws_session_token }}
        aws-region: ${{ github.event.inputs.aws_region }}

    - name: Terraform Init
      working-directory: ./iac
      run: terraform init

    - name: Terraform Plan
      working-directory: ./iac
      run: terraform plan

    - name: Terraform Apply
      working-directory: ./iac
      run: terraform apply --auto-approve
# trigger workflow
