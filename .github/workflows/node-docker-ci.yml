name: Node.js CI and Docker Build

on:
  push:
    branches: [ init ]
  pull_request:
    types: [closed]
    branches: [ init ]
  workflow_dispatch:

jobs:
  build-test-docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm run test

      - name: Test coverage
        run: npm run test:coverage

      - name: Log in to Docker Hub
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Build Docker image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/bulletin-board-app:1.0 .
          docker tag ${{ secrets.DOCKERHUB_USERNAME }}/bulletin-board-app:1.0 ${{ secrets.DOCKERHUB_USERNAME }}/bulletin-board-app:latest

      - name: Push Docker image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/bulletin-board-app:1.0
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/bulletin-board-app:latest
